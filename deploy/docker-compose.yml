# Kontinuance local stack: the API server + the web UI on a single origin.
#
#   cp deploy/.env.example deploy/.env       # then set a real DEPLOY_TOKEN
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#   open http://localhost:${KONTINUANCE_WEB_PORT:-8080}
#
# Only the web service is published, so the browser talks to one origin; the web container proxies
# /api, the SSE stream, and /ws/runs to the server over the internal network.
name: kontinuance

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8077
      KONTINUANCE_STORE: ${KONTINUANCE_STORE:-/data/runs}
      # Run history backend (042): `sqlite` (default) keeps runs and their output in one embedded
      # database, /data/runs/kontinuance.db, on the volume below — copy that one file to back the
      # history up, or read it with `sqlite3`. `file` keeps the original file-per-run layout. Switching
      # to sqlite imports an existing file history once and leaves the files in place, so switching back
      # loses nothing.
      KONTINUANCE_STORE_BACKEND: ${KONTINUANCE_STORE_BACKEND:-sqlite}
      KONTINUANCE_CONFIG_DESCRIPTOR: ${KONTINUANCE_CONFIG_DESCRIPTOR:-/etc/kontinuance/kontinuance.yml}
      # Operator credential. Set BOTH to enable sign-in — which is also what lets you connect a GitHub
      # repository from the Source screen, since that endpoint accepts a token and will not do so on an
      # unauthenticated server. Leave both empty to run open (no sign-in, no GitHub connect from the UI).
      KONTINUANCE_AUTH_USERNAME: ${KONTINUANCE_AUTH_USERNAME:-}
      KONTINUANCE_AUTH_PASSWORD: ${KONTINUANCE_AUTH_PASSWORD:-}
      # GitHub event-source state, kept on the run-history volume so a connected repository survives a
      # restart. Without these they would default under the container's home directory and be lost.
      KONTINUANCE_GITHUB_CONFIG: ${KONTINUANCE_GITHUB_CONFIG:-/data/runs/github/source.yaml}
      KONTINUANCE_GITHUB_CURSORS: ${KONTINUANCE_GITHUB_CURSORS:-/data/runs/github/cursors.properties}
      KONTINUANCE_GITHUB_HEARTBEAT: ${KONTINUANCE_GITHUB_HEARTBEAT:-/data/runs/github/heartbeat.properties}
      KONTINUANCE_GITHUB_TOKEN_FILE: ${KONTINUANCE_GITHUB_TOKEN_FILE:-/data/runs/github/token}
      # Pipeline secrets referenced by the descriptor, passed through from the host env — never baked in.
      DEPLOY_TOKEN: ${DEPLOY_TOKEN:-}
    volumes:
      - kontinuance-runs:/data/runs
      # Default pipeline descriptor (read-only). Point at your own by changing this mount.
      - ./kontinuance.yml:/etc/kontinuance/kontinuance.yml:ro
    expose:
      - "8077"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      KONTINUANCE_BACKEND: ${KONTINUANCE_BACKEND:-http://server:8077}
    ports:
      - "${KONTINUANCE_WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  # Run history persists here across restarts (remove with `docker compose down -v`).
  kontinuance-runs:
