# Test-only overrides. Spring Boot loads application.properties alongside the main application.yml and
# gives .properties the higher precedence, so this adds these keys without replacing the main config.

# Never start the GitHub event source during tests. Without this, a developer machine that happens to have
# both an event-source config and a resolvable token would have the suite poll real GitHub. Tests that
# exercise connect/disconnect drive the service explicitly instead.
kontinuance.github.autostart=false
