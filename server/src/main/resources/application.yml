spring:
  application:
    name: kontinuance-api
  # JSON codec (Jackson): omit null properties so responses keep the "absent when unset" shape the UI
  # expects (e.g. a run's repo/sha, an unconfigured source's fields). Jackson 3 already writes java.time
  # values as ISO-8601 strings by default, so no date-format override is needed.
  jackson:
    default-property-inclusion: non_null

# The read API binds loopback:8077 by default (matching the retired 007 launcher). Override with
# SERVER_ADDRESS / SERVER_PORT (Spring relaxed binding) when exposing on a private network.
server:
  address: 127.0.0.1
  port: 8077

# Store location the CI service writes run history to. Override with KONTINUANCE_STORE.
kontinuance:
  # Authentication (016): set BOTH to enforce a login gate on the API; leave empty (default) to run open
  # (loopback/dev) — the server logs a warning at startup when unauthenticated. Supply via
  # KONTINUANCE_AUTH_USERNAME / KONTINUANCE_AUTH_PASSWORD (never commit secret values).
  # Setting only ONE of the two is a startup failure: a partially-applied secret would otherwise serve the
  # API unauthenticated while looking protected. Set `required` (KONTINUANCE_AUTH_REQUIRED) on any
  # deployment that must never run open — then missing credentials fail startup instead of opening the API.
  auth:
    username: ${KONTINUANCE_AUTH_USERNAME:}
    password: ${KONTINUANCE_AUTH_PASSWORD:}
    required: ${KONTINUANCE_AUTH_REQUIRED:false}
  store: ${user.home}/.kontinuance/runs
  # GitHub event source (003/035/036/040). The server can host the poll loop itself, so a repository is
  # connected from the Source screen rather than by hand-writing this config and running the separate
  # `kontinuance-ci` CLI. These paths are the same files that CLI uses, so either can drive them.
  #
  # `config` is written by the connect endpoint and read at startup; `token-file` holds the access token
  # when one was supplied through the UI (owner-only permissions, never returned by the API) — a
  # deployment that would rather keep the secret in the environment names a variable in the config's
  # `tokenEnv` instead, which takes precedence. Set `autostart: false` to leave a stored source stopped
  # until someone starts it from the UI.
  #
  # Connecting from the UI requires the operator credential above: the endpoint accepts a token, and an
  # unauthenticated server refuses it.
  github:
    config: ${KONTINUANCE_GITHUB_CONFIG:${user.home}/.kontinuance/github-source.yaml}
    cursors: ${KONTINUANCE_GITHUB_CURSORS:${user.home}/.kontinuance/github-cursors.properties}
    heartbeat: ${KONTINUANCE_GITHUB_HEARTBEAT:${user.home}/.kontinuance/github-heartbeat.properties}
    token-file: ${KONTINUANCE_GITHUB_TOKEN_FILE:${user.home}/.kontinuance/github-token}
    autostart: ${KONTINUANCE_GITHUB_AUTOSTART:true}
  # Live SSE (/api/runs/stream) + WebSocket (/ws/runs): how often to re-read the store for new runs,
  # and the bound on the initial newest-first snapshot sent on connect.
  stream:
    poll-interval-ms: 1000
    snapshot-limit: 50

# Actuator: expose only the health endpoint (FR-002) — no secrets or sensitive endpoints published.
management:
  endpoints:
    web:
      exposure:
        include: health
